[workspace]
resolver = "3"
members = ["crates/mpris-core", "crates/libobs-sys", "crates/obs-mpris", "crates/render"]
# Needs libclang and the OBS headers, which the normal build must not (D-01).
exclude = ["tools/gen-libobs-bindings"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "GPL-2.0-or-later"
repository = "https://gitlab.com/iglou.eu/obs-dbus-mpris"
